server:
  port: 8080

spring:
  application:
    name: pm-agent-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pm_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PM_AGENT_DB_USERNAME:pm_agent}
    password: ${PM_AGENT_DB_PASSWORD:pm_agent_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: ${PM_AGENT_JWT_SECRET:pm-agent-dev-secret-change-me}
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: true

knife4j:
  enable: true

pm:
  tenant:
    enabled: false
  agent-service:
    # Python Agent 服务地址，默认指向本地 FastAPI
    base-url: ${PM_AGENT_SERVICE_BASE_URL:http://localhost:8000}
    # 单次对话调用超时，单位毫秒
    timeout-ms: ${PM_AGENT_SERVICE_TIMEOUT_MS:60000}
