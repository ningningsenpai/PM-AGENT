server:
  port: 8080

spring:
  application:
    name: pm-agent-backend
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pm_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PM_AGENT_DB_USERNAME:pm_agent}
    password: ${PM_AGENT_DB_PASSWORD:pm_agent_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: ${PM_AGENT_JWT_SECRET:pm-agent-dev-secret-change-me}
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: true

knife4j:
  enable: true

pm-agent:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:pm-agent}
      secret-key: ${MINIO_ROOT_PASSWORD:123456-pm-agent}
      bucket: ${MINIO_BUCKET:pm-agent}
      max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:52428800}
      read-url-expiry-seconds: ${MINIO_READ_URL_EXPIRY_SECONDS:300}
