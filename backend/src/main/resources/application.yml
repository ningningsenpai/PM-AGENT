server:
  port: 8080

spring:
  application:
    name: pm-agent-backend
  config:
    import: classpath:config/rabbitmq.yml
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PM_AGENT_DB_HOST:localhost}:${PM_AGENT_DB_PORT:3306}/${PM_AGENT_DB_NAME:pm_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PM_AGENT_DB_USERNAME:pm_agent}
    password: ${PM_AGENT_DB_PASSWORD:pm_agent_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${PM_AGENT_REDIS_HOST:localhost}
      port: ${PM_AGENT_REDIS_PORT:6379}
      password: ${PM_AGENT_REDIS_PASSWORD:pm-agent-dev}
      database: ${PM_AGENT_REDIS_DATABASE:1}
      connect-timeout: 3s
      timeout: 3s
      client-type: lettuce
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: ${PM_AGENT_JWT_SECRET:pm-agent-dev-secret-change-me}
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: true

knife4j:
  enable: true

pm-agent:
  file:
    validation:
      # 按完整目录名精确匹配，不会把 contest 误判为 test
      ignored-directory-names:
        - .git
        - .svn
        - .hg
        - .idea
        - .vscode
        - target
        - build
        - dist
        - out
        - coverage
        - test
        - tests
        - module
        - node_modules
        - .gradle
        - .venv
        - venv
        - __pycache__
        - .pytest_cache
        - .mypy_cache
        - .ruff_cache
        - .next
        - .nuxt
        - .vite
      ignored-file-names:
        - .DS_Store
        - Thumbs.db
        - desktop.ini
        - .project
        - .classpath
        - .env
        - .env.local
        - .env.development
        - .env.production
        - .env.test
      # 为空时关闭白名单限制；配置后只允许名单内扩展名
      allowed-extensions: []
      blocked-extensions:
        - exe
        - dll
        - com
        - msi
        - scr
        - iml
        - ipr
        - iws
        - class
        - jar
        - war
        - ear
        - log
        - tmp
        - cache
      blocked-mime-types:
        - application/x-msdownload
        - application/x-dosexec
        - application/x-executable
        - application/x-sharedlib
        - application/vnd.microsoft.portable-executable
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:pm-agent}
      secret-key: ${MINIO_ROOT_PASSWORD:123456-pm-agent}
      bucket: ${MINIO_BUCKET:pm-agent}
      max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:52428800}
      read-url-expiry-seconds: ${MINIO_READ_URL_EXPIRY_SECONDS:300}
