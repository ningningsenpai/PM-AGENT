server:
  port: 8080

spring:
  application:
    name: pm-agent-backend
  config:
    import: classpath:config/rabbitmq.yml
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PM_AGENT_DB_HOST:10.144.48.123}:${PM_AGENT_DB_PORT:3306}/${PM_AGENT_DB_NAME:pm_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PM_AGENT_DB_USERNAME:pm_agent}
    password: ${PM_AGENT_DB_PASSWORD:pm_agent_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 未知的非空数据库必须先备份并重建，禁止自动基线掩盖结构偏差
    baseline-on-migrate: false
  data:
    redis:
      host: ${PM_AGENT_REDIS_HOST:10.144.48.123}
      port: ${PM_AGENT_REDIS_PORT:6379}
      password: ${PM_AGENT_REDIS_PASSWORD:pm-agent-dev}
      database: ${PM_AGENT_REDIS_DATABASE:1}
      connect-timeout: 3s
      timeout: 3s
      client-type: lettuce
  servlet:
    multipart:
      max-file-size: ${PM_AGENT_MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${PM_AGENT_MAX_UPLOAD_REQUEST_SIZE:256MB}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  jwt-secret-key: ${PM_AGENT_JWT_SECRET:pm-agent-dev-secret-change-me}
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: true

knife4j:
  enable: true

pm-agent:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://10.144.48.123:9000}
      access-key: ${MINIO_ROOT_USER:pm-agent}
      secret-key: ${MINIO_ROOT_PASSWORD:123456-pm-agent}
      max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:52428800}
      read-url-expiry-seconds: ${MINIO_READ_URL_EXPIRY_SECONDS:300}
      connect-timeout-seconds: ${MINIO_CONNECT_TIMEOUT_SECONDS:2}
      read-timeout-seconds: ${MINIO_READ_TIMEOUT_SECONDS:10}
      write-timeout-seconds: ${MINIO_WRITE_TIMEOUT_SECONDS:10}
