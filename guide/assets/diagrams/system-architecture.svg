<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">PM-Agent 总体技术架构</title>
  <desc id="desc">从项目成员、Vue 3 工作台、FastAPI 模块化单体到 MySQL、Redis、MinIO 和大模型的分层架构图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526273"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: 'Times New Roman','SimSun','宋体',serif; fill: #172033; }
      .canvas { fill: #ffffff; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5e6b7a; }
      .group { fill: #f8fafc; stroke: #c8d2df; stroke-width: 2; }
      .group-title { font-size: 20px; font-weight: 700; fill: #425466; }
      .node { stroke-width: 2.2; rx: 14; filter: url(#shadow); }
      .blue { fill: #eaf2ff; stroke: #3b82f6; }
      .green { fill: #eaf8f1; stroke: #269b6a; }
      .yellow { fill: #fff6d8; stroke: #d69b18; }
      .purple { fill: #f2edff; stroke: #7759d7; }
      .orange { fill: #fff0e5; stroke: #e47937; }
      .node-title { font-size: 21px; font-weight: 700; text-anchor: middle; }
      .node-body { font-size: 16px; fill: #536173; text-anchor: middle; }
      .arrow { fill: none; stroke: #526273; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #526273; stroke-width: 2.4; }
      .label { font-size: 16px; font-weight: 700; fill: #526273; text-anchor: middle; }
      .legend-title { font-size: 18px; font-weight: 700; }
      .legend-text { font-size: 16px; fill: #4b5968; }
      .note { fill: #f8fafc; stroke: #aab7c5; stroke-width: 1.6; rx: 12; }
      .note-text { font-size: 17px; fill: #39495a; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="860"/>
  <text class="title" x="60" y="55">PM-Agent 总体技术架构</text>
  <text class="subtitle" x="60" y="88">模块化单体承载业务边界，数据、对象与模型能力各司其职</text>

  <rect class="group" x="45" y="140" width="220" height="480" rx="20"/>
  <text class="group-title" x="70" y="178">01 · 使用入口</text>
  <rect class="node blue" x="75" y="225" width="160" height="90"/>
  <text class="node-title" x="155" y="263">项目成员</text>
  <text class="node-body" x="155" y="290">资料、问题与确认</text>
  <path class="arrow" d="M155 315 V365"/>
  <rect class="node blue" x="75" y="365" width="160" height="125"/>
  <text class="node-title" x="155" y="405">Vue 3 工作台</text>
  <text class="node-body" x="155" y="435">项目 · 文件 · 会话</text>
  <text class="node-body" x="155" y="462">上下文 · 报告</text>

  <rect class="group" x="305" y="140" width="790" height="480" rx="20"/>
  <text class="group-title" x="330" y="178">02 · FastAPI 模块化单体</text>
  <rect class="node orange" x="340" y="360" width="190" height="130"/>
  <text class="node-title" x="435" y="402">API 边界</text>
  <text class="node-body" x="435" y="432">JWT · Trace</text>
  <text class="node-body" x="435" y="458">Pydantic 契约</text>
  <path class="arrow" d="M235 428 H340"/>
  <text class="label" x="286" y="415">REST / JSON</text>

  <path class="branch" d="M530 425 H565 V265"/>
  <path class="branch" d="M565 265 V545"/>
  <path class="arrow" d="M565 265 H610"/>
  <path class="arrow" d="M565 355 H610"/>
  <path class="arrow" d="M565 445 H610"/>
  <path class="arrow" d="M565 535 H610"/>

  <rect class="node green" x="610" y="225" width="265" height="80"/>
  <text class="node-title" x="742" y="258">认证与项目</text>
  <text class="node-body" x="742" y="283">用户、会话与项目空间</text>
  <rect class="node green" x="610" y="315" width="265" height="80"/>
  <text class="node-title" x="742" y="348">文件与解析</text>
  <text class="node-body" x="742" y="373">同步、状态、Detail 与 Index</text>
  <rect class="node green" x="610" y="405" width="265" height="80"/>
  <text class="node-title" x="742" y="438">会话与上下文</text>
  <text class="node-body" x="742" y="463">请求理解、记忆与确认</text>
  <rect class="node green" x="610" y="495" width="265" height="80"/>
  <text class="node-title" x="742" y="528">Agent 与报告</text>
  <text class="node-body" x="742" y="553">工具编排、证据与运行轨迹</text>

  <path class="branch" d="M875 265 H905"/>
  <path class="branch" d="M875 355 H905"/>
  <path class="branch" d="M875 445 H905"/>
  <path class="branch" d="M875 535 H905"/>
  <path class="branch" d="M905 265 V535"/>
  <path class="arrow" d="M905 425 H935"/>
  <rect class="node orange" x="935" y="350" width="130" height="150"/>
  <text class="node-title" x="1000" y="397">Service</text>
  <text class="node-title" x="1000" y="424">边界</text>
  <text class="node-body" x="1000" y="456">权限 · 幂等</text>
  <text class="node-body" x="1000" y="480">事务 · 版本</text>

  <rect class="group" x="1135" y="140" width="420" height="480" rx="20"/>
  <text class="group-title" x="1160" y="178">03 · 基础设施与模型</text>
  <path class="branch" d="M1065 425 H1110"/>
  <path class="branch" d="M1110 260 V535"/>
  <path class="arrow" d="M1110 260 H1180"/>
  <path class="arrow" d="M1110 350 H1180"/>
  <path class="arrow" d="M1110 440 H1180"/>
  <path class="arrow" d="M1110 530 H1180"/>

  <rect class="node purple" x="1180" y="220" width="330" height="80"/>
  <text class="node-title" x="1345" y="253">MySQL</text>
  <text class="node-body" x="1345" y="278">业务事实、会话与运行记录</text>
  <rect class="node purple" x="1180" y="310" width="330" height="80"/>
  <text class="node-title" x="1345" y="343">Redis</text>
  <text class="node-body" x="1345" y="368">JWT 会话、幂等、租约与缓存</text>
  <rect class="node purple" x="1180" y="400" width="330" height="80"/>
  <text class="node-title" x="1345" y="433">MinIO</text>
  <text class="node-body" x="1345" y="458">原文件与固定上下文资产</text>
  <rect class="node yellow" x="1180" y="490" width="330" height="80"/>
  <text class="node-title" x="1345" y="523">DeepSeek / LLM</text>
  <text class="node-body" x="1345" y="548">语义解析、请求理解与生成</text>

  <rect class="note" x="305" y="645" width="1250" height="66"/>
  <text class="note-text" x="930" y="685"><tspan font-weight="700">关键边界：</tspan>API 不直连基础设施；跨模块通过 Service 协作；MinIO 与 LLM 调用位于数据库事务之外。</text>

  <text class="legend-title" x="60" y="778">图例</text>
  <rect class="blue" x="130" y="754" width="34" height="24" rx="5"/>
  <text class="legend-text" x="176" y="773">用户与交互入口</text>
  <rect class="green" x="350" y="754" width="34" height="24" rx="5"/>
  <text class="legend-text" x="396" y="773">确定性业务模块</text>
  <rect class="orange" x="615" y="754" width="34" height="24" rx="5"/>
  <text class="legend-text" x="661" y="773">校验与业务边界</text>
  <rect class="purple" x="885" y="754" width="34" height="24" rx="5"/>
  <text class="legend-text" x="931" y="773">数据与对象存储</text>
  <rect class="yellow" x="1150" y="754" width="34" height="24" rx="5"/>
  <text class="legend-text" x="1196" y="773">模型语义能力</text>
  <path class="arrow" d="M1400 766 H1470"/>
  <text class="legend-text" x="1490" y="773">调用方向</text>
</svg>
