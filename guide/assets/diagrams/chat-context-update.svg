<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">聊天过程中的上下文文件更新</title>
  <desc id="desc">用户消息产生上下文更新信号后，明确内容自动受控更新，模糊或冲突内容先生成草稿并由用户确认。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#526273"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: 'Times New Roman','SimSun','宋体',serif; fill: #172033; }
      .canvas { fill: #ffffff; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5e6b7a; }
      .node { stroke-width: 2.2; rx: 14; filter: url(#shadow); }
      .blue { fill: #eaf2ff; stroke: #3b82f6; }
      .green { fill: #eaf8f1; stroke: #269b6a; }
      .yellow { fill: #fff6d8; stroke: #d69b18; }
      .purple { fill: #f2edff; stroke: #7759d7; }
      .orange { fill: #fff0e5; stroke: #e47937; }
      .gray { fill: #f3f5f7; stroke: #8795a5; }
      .node-title { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .node-body { font-size: 15.5px; fill: #536173; text-anchor: middle; }
      .arrow { fill: none; stroke: #526273; stroke-width: 3; marker-end: url(#arrow); }
      .data { fill: none; stroke: #728197; stroke-width: 2.3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .group { fill: #f8fafc; stroke: #c8d2df; stroke-width: 2; rx: 18; }
      .group-title { font-size: 20px; font-weight: 700; }
      .target { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 16px; font-weight: 700; fill: #526273; text-anchor: middle; }
      .legend-title { font-size: 18px; font-weight: 700; }
      .legend-text { font-size: 16px; fill: #4b5968; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1040"/>
  <text class="title" x="60" y="55">聊天过程中的上下文文件更新</text>
  <text class="subtitle" x="60" y="88">模型只识别候选信号；是否写入、写到哪里以及何时生效由后端和用户共同决定</text>

  <rect class="node blue" x="45" y="145" width="200" height="100"/>
  <text class="node-title" x="145" y="185">用户消息</text>
  <text class="node-body" x="145" y="215">问题、纠正、规则或偏好</text>
  <path class="arrow" d="M245 195 H285"/>

  <rect class="node purple" x="285" y="145" width="200" height="100"/>
  <text class="node-title" x="385" y="185">保存消息</text>
  <text class="node-body" x="385" y="215">MySQL 会话事实</text>
  <path class="arrow" d="M485 195 H525"/>

  <rect class="node yellow" x="525" y="145" width="230" height="100"/>
  <text class="node-title" x="640" y="185">多维请求理解</text>
  <text class="node-body" x="640" y="215">提取 ContextUpdateSignal</text>
  <path class="arrow" d="M755 195 H795"/>

  <rect class="node orange" x="795" y="145" width="220" height="100"/>
  <text class="node-title" x="905" y="185">是否需要沉淀</text>
  <text class="node-body" x="905" y="215">检查目标、明确度与置信度</text>
  <path class="arrow" d="M1015 195 H1055"/>
  <text class="label" x="1035" y="181">否</text>

  <rect class="node green" x="1055" y="145" width="220" height="100"/>
  <text class="node-title" x="1165" y="185">继续项目问答</text>
  <text class="node-body" x="1165" y="215">召回、工具调用与回答</text>
  <path class="arrow" d="M1275 195 H1315"/>

  <rect class="node blue" x="1315" y="145" width="240" height="100"/>
  <text class="node-title" x="1435" y="185">本轮响应</text>
  <text class="node-body" x="1435" y="215">回答 + contextUpdate 结果</text>

  <path class="arrow" d="M905 245 V325"/>
  <text class="label" x="930" y="290">是</text>
  <rect class="node green" x="795" y="325" width="220" height="100"/>
  <text class="node-title" x="905" y="365">识别目标类型</text>
  <text class="node-body" x="905" y="395">规则、记忆或用户偏好</text>
  <path class="data" d="M795 375 H685"/>

  <rect class="group" x="45" y="315" width="640" height="330" rx="18"/>
  <text class="group-title" x="75" y="355">固定上下文目标</text>
  <rect class="orange" x="80" y="385" width="255" height="70" rx="12"/>
  <text class="target" x="207" y="414">项目约束</text>
  <text class="node-body" x="207" y="439">project_specification/*.json</text>
  <rect class="purple" x="365" y="385" width="280" height="70" rx="12"/>
  <text class="target" x="505" y="414">长期记忆</text>
  <text class="node-body" x="505" y="439">long_term_memory.json</text>
  <rect class="purple" x="80" y="485" width="255" height="70" rx="12"/>
  <text class="target" x="207" y="514">短期记忆</text>
  <text class="node-body" x="207" y="539">short_term_memory.json</text>
  <rect class="blue" x="365" y="485" width="280" height="70" rx="12"/>
  <text class="target" x="505" y="514">项目级用户偏好</text>
  <text class="node-body" x="505" y="539">user_habits/*.json</text>
  <text class="node-body" x="365" y="600">消息保存在 MySQL；正式上下文正文写入 MinIO 固定对象。</text>

  <path class="arrow" d="M1015 375 H1055"/>
  <rect class="node orange" x="1055" y="325" width="260" height="100"/>
  <text class="node-title" x="1185" y="365">明确且无冲突？</text>
  <text class="node-body" x="1185" y="395">显式程度 · 风险 · 当前版本</text>

  <path class="arrow" d="M1185 425 V565"/>
  <text class="label" x="1210" y="500">是</text>

  <path class="arrow" d="M1055 375 H905 V485"/>
  <text class="label" x="1007" y="360">否</text>
  <rect class="node yellow" x="795" y="485" width="220" height="100"/>
  <text class="node-title" x="905" y="525">待确认草稿</text>
  <text class="node-body" x="905" y="555">保留候选内容与原始引用</text>
  <path class="arrow" d="M905 585 V650"/>
  <rect class="node blue" x="795" y="650" width="220" height="105"/>
  <text class="node-title" x="905" y="690">用户处理</text>
  <text class="node-body" x="905" y="720">编辑 · 细化 · 确认或放弃</text>
  <path class="arrow" d="M1015 703 H1055"/>

  <rect class="node orange" x="1055" y="565" width="260" height="190"/>
  <text class="node-title" x="1185" y="605">统一更新门禁</text>
  <text class="node-body" x="1185" y="638">项目与用户范围</text>
  <text class="node-body" x="1185" y="666">目标分区白名单</text>
  <text class="node-body" x="1185" y="694">ETag / 版本 / 幂等</text>
  <text class="node-body" x="1185" y="722">冲突检查与内容校验</text>
  <path class="arrow" d="M1315 660 H1350"/>

  <rect class="node purple" x="1350" y="565" width="205" height="190"/>
  <text class="node-title" x="1452" y="605">条件写入 MinIO</text>
  <text class="node-body" x="1452" y="638">更新目标固定文件</text>
  <text class="node-body" x="1452" y="666">回读实际内容</text>
  <text class="node-body" x="1452" y="694">记录更新日志</text>
  <text class="node-body" x="1452" y="722">保存运行结果</text>

  <path class="arrow" d="M1452 755 V815"/>
  <rect class="node green" x="1295" y="815" width="260" height="95"/>
  <text class="node-title" x="1425" y="852">更新结果可追踪</text>
  <text class="node-body" x="1425" y="882">生效 / 待确认 / 冲突 / 失败</text>
  <path class="arrow" d="M1555 862 H1580 V195 H1555"/>

  <text class="legend-title" x="60" y="970">图例</text>
  <rect class="blue" x="130" y="946" width="34" height="24" rx="5"/>
  <text class="legend-text" x="176" y="965">用户操作 / 响应</text>
  <rect class="yellow" x="385" y="946" width="34" height="24" rx="5"/>
  <text class="legend-text" x="431" y="965">模型提取 / 待确认</text>
  <rect class="orange" x="675" y="946" width="34" height="24" rx="5"/>
  <text class="legend-text" x="721" y="965">判断 / 写入门禁</text>
  <rect class="green" x="940" y="946" width="34" height="24" rx="5"/>
  <text class="legend-text" x="986" y="965">业务处理 / 状态结果</text>
  <rect class="purple" x="1240" y="946" width="34" height="24" rx="5"/>
  <text class="legend-text" x="1286" y="965">持久化数据 / 上下文文件</text>
</svg>
