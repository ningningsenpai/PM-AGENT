[project]
name = "pm-agent-service"
version = "0.1.0"
description = "PM-Agent Python Agent 服务 Demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    "pyahocorasick>=2.1.0"
]

[tool.uvicorn]
factory = false

[tool.setuptools.packages.find]
include = ["app*", "normalization_demo*"]
exclude = ["eval*", "training*", "tests*"]
