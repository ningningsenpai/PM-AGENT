[project]
name = "pm-agent-service"
version = "0.1.0"
description = "PM-Agent Python Agent 服务 Demo"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncmy>=0.2.10,<1.0.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "minio>=7.2.0,<8.0.0",
    "pwdlib[argon2]>=0.2.0,<1.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "pydantic>=2.8.0",
    "pyahocorasick>=2.1.0",
    "python-multipart>=0.0.20,<1.0.0",
    "redis>=6.0.0,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<2.1.0"
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uvicorn]
factory = false

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["eval*", "training*", "tests*"]
