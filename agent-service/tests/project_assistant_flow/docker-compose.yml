name: pm-agent-assistant-test
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${FLOW_MYSQL_PASSWORD:?需要本地测试密码}
      MYSQL_DATABASE: pm_agent_assistant_test
    ports: ["127.0.0.1:19306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    mem_limit: 2g
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:19379:6379"]
    mem_limit: 256m
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${FLOW_MINIO_USER:?需要本地测试用户}
      MINIO_ROOT_PASSWORD: ${FLOW_MINIO_PASSWORD:?需要本地测试密码}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio-data:/data"]
    mem_limit: 1g
volumes:
  mysql-data:
  minio-data:
